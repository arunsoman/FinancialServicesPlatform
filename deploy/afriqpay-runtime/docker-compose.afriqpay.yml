# FSP production deployment — web.afriqpay.com
# SUPERSEDED by deploy/pipeline (GitHub Actions deploys production from `main`). Kept only as the
# record of the hand-made stack. Data paths corrected 2026-11-24 to what the running containers
# actually mount (/home/ubuntu/fsp-data) — the former ./fsp-data would have booted prod EMPTY.
# network: fsp-network (external, created once). TLS terminated by HOST nginx (certbot).
# Only postgres + tigerbeetle ports stay purely internal; idp/gateway/bff publish to 127.0.0.1 only.

services:
  postgres:
    image: postgres:17-alpine
    container_name: fsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/ubuntu/fsp-data/postgres:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/99-fsp-plugin-dbs.sql:ro
    networks: [fsp-network]
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 5s
      retries: 10

  tigerbeetle-format:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    container_name: fsp-tb-format
    security_opt:
      - seccomp=unconfined
    networks: [fsp-network]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ -s /data/0_0.tigerbeetle ]; then echo 'tb already formatted'; else
       /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle; fi"
    volumes:
      - /home/ubuntu/fsp-data/tigerbeetle:/data
    restart: "no"

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    container_name: fsp-tigerbeetle
    security_opt:
      - seccomp=unconfined
    networks:
      fsp-network:
        ipv4_address: 10.200.0.10
    command: "start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle"
    volumes:
      - /home/ubuntu/fsp-data/tigerbeetle:/data
    depends_on: [tigerbeetle-format]
    restart: unless-stopped

  core:
    image: fsp/core:latest
    container_name: fsp-core
    # TigerBeetle Java client needs io_uring syscalls (blocked by the default seccomp profile)
    security_opt:
      - seccomp=unconfined
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/core-0.0.1-SNAPSHOT.jar } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fsp
      SPRING_DATASOURCE_USERNAME: fsp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FSP_BOOTSTRAP_PASSWORD: ${FSP_BOOTSTRAP_PASSWORD}
      FSP_INTERNAL_CREDENTIAL: ${FSP_INTERNAL_CREDENTIAL}
      FSP_PERSON_PASSWORD: ${FSP_PERSON_PASSWORD}
      SPRING_APPLICATION_JSON: '{"fsp":{"tigerbeetle":{"addresses":"10.200.0.10:3000"},"gateway":{"actor-jwks-url":"http://gateway:8090/.well-known/fsp-actor-jwks"}}}'
    volumes:
      - ./pki:/opt/fsp/pki:ro
    networks: [fsp-network]
    depends_on:
      postgres: { condition: service_healthy }
      tigerbeetle: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || curl -sf http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  idp:
    image: fsp/idp:latest
    container_name: fsp-idp
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/idp-0.0.1-SNAPSHOT.jar } }
    environment: &idp_common
      FSP_DB_URL: jdbc:postgresql://postgres:5432/fsp
      FSP_DB_USER: fsp
      FSP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      FSP_IDP_ISSUER: https://fsp-auth.afriqpay.com
      FSP_IDP_SIGNING_KEY: /opt/fsp/pki/idp-signing.pem
      FSP_INTERNAL_CREDENTIAL: ${FSP_INTERNAL_CREDENTIAL}
    volumes:
      - ./pki:/opt/fsp/pki:ro
    ports:
      - "127.0.0.1:19082:8082"
    networks: [fsp-network]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: fsp/gateway:latest
    container_name: fsp-gateway
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/gateway-0.0.1-SNAPSHOT.jar } }
    environment:
      FSP_CORE_URL: http://core:8081
      FSP_IDP_URL: http://idp:8082
      FSP_IDP_ISSUER: https://fsp-auth.afriqpay.com
      FSP_INTERNAL_CREDENTIAL: ${FSP_INTERNAL_CREDENTIAL}
      SPRING_APPLICATION_JSON: '{"fsp":{"gateway":{"assertion-key":"/opt/fsp/pki/gateway-assertion.pem","assertion-key-create":false}}}'
    volumes:
      - ./pki:/opt/fsp/pki:ro
    ports:
      - "127.0.0.1:19090:8090"
    networks: [fsp-network]
    depends_on:
      - core
      - idp

  bff:
    image: fsp/bff:latest
    container_name: fsp-bff
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/bff-0.0.1-SNAPSHOT.jar } }
    environment:
      FSP_GATEWAY_URL: http://gateway:8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fsp
      SPRING_DATASOURCE_USERNAME: fsp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_APPLICATION_JSON: '{"server":{"servlet":{"session":{"cookie":{"secure":true}}}},"fsp":{"idp-issuer":"https://fsp-auth.afriqpay.com","login-redirect-uri":"https://fsp.afriqpay.com/bff/auth/callback","authorize-url-base":"https://fsp-auth.afriqpay.com"}}'
    ports:
      - "127.0.0.1:19080:8080"
    networks: [fsp-network]
    depends_on:
      - gateway
      - postgres

  plugin-kyc:
    image: fsp/plugin-kyc:latest
    container_name: fsp-plugin-kyc
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/kyc-0.0.1-SNAPSHOT.jar } }
    environment:
      FSP_PLUGIN_KYC_DB_URL: jdbc:postgresql://postgres:5432/fsp_plugin_kyc
      FSP_PLUGIN_KYC_DB_USER: fsp_plugin_kyc
      FSP_PLUGIN_KYC_DB_PASSWORD: ${FSP_PLUGIN_KYC_DB_PASSWORD}
      SERVER_PORT: 8083
      FSP_GATEWAY_URL: http://gateway:8090
      FSP_IDP_ISSUER: https://fsp-auth.afriqpay.com
      FSP_PLUGIN_KYC_CLIENT_KEY: /opt/fsp/pki/plugin-kyc-client.pem
      FSP_PLUGIN_KYC_DPOP_KEY: /opt/fsp/pki/plugin-kyc-dpop.pem
      FSP_PLUGIN_KYC_CREATE_KEYS: "false"
    volumes:
      - ./pki:/opt/fsp/pki:ro
    networks: [fsp-network]
    depends_on:
      postgres: { condition: service_healthy }

  plugin-inventory:
    image: fsp/plugin-inventory:latest
    container_name: fsp-plugin-inventory
    build: { context: ., dockerfile: Dockerfile.runtime, args: { JAR: jars/inventory-0.0.1-SNAPSHOT.jar } }
    environment:
      FSP_PLUGIN_INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/fsp_plugin_inventory
      FSP_PLUGIN_INVENTORY_DB_USER: fsp_plugin_inventory
      FSP_PLUGIN_INVENTORY_DB_PASSWORD: ${FSP_PLUGIN_INVENTORY_DB_PASSWORD}
      SERVER_PORT: 8084
      FSP_GATEWAY_URL: http://gateway:8090
      FSP_IDP_ISSUER: https://fsp-auth.afriqpay.com
      FSP_PLUGIN_INVENTORY_KEK: ${FSP_PLUGIN_INVENTORY_KEK}
      FSP_PLUGIN_INVENTORY_CLIENT_KEY: /opt/fsp/pki/plugin-inventory-client.pem
      FSP_PLUGIN_INVENTORY_DPOP_KEY: /opt/fsp/pki/plugin-inventory-dpop.pem
      FSP_PLUGIN_INVENTORY_CREATE_KEYS: "false"
    volumes:
      - ./pki:/opt/fsp/pki:ro
    networks: [fsp-network]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  fsp-network:
    external: true
