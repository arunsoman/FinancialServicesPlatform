# FSP observability stack. Deployed by .github/workflows/monitoring.yml (scripts/monitor-up.sh);
# first time by scripts/monitor-bootstrap.sh. Isolated + capped like staging:
#   own project/containers/network, loopback-only ports, all inside fsp-monitor.slice
#   (MemoryMax 2 GiB, CPUQuota 100%, lowest CPU/IO weight), OOM-killed before anything else.
# Budget (sum of ceilings): 1.875 GiB RAM, 2.0 CPUs (slice caps the total at 2 GiB / 1 CPU).

x-caps: &caps
  restart: unless-stopped
  cgroup_parent: ${FSP_MON_SLICE:?}
  cpu_shares: 128
  oom_score_adj: 500
  pids_limit: 512
  networks: [mon]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  loki:
    <<: *caps
    image: grafana/loki:3.7.10
    container_name: fsp-monitor-loki
    user: "${FSP_UID:?}:${FSP_GID:?}"
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_STAGING: ${LOKI_RETENTION_STAGING:?}
      LOKI_RETENTION_PRODUCTION: ${LOKI_RETENTION_PRODUCTION:?}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ${FSP_MON_HOME:?}/data/loki:/loki
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m

  prometheus:
    <<: *caps
    image: prom/prometheus:v3.16.0
    container_name: fsp-monitor-prometheus
    user: "${FSP_UID}:${FSP_GID}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:?}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:?}
      - --web.enable-remote-write-receiver
      - --web.external-url=https://${PROM_HOST:?}/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ${FSP_MON_HOME}/data/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROM_PORT:?}:9090"
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m

  alloy:
    <<: *caps
    image: grafana/alloy:v1.22.0
    container_name: fsp-monitor-alloy
    cgroup: host                         # see the host cgroup tree (cgroup v2) — read-only use
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro                     # cAdvisor reads every container's cgroup under /sys/fs/cgroup
      - /run/udev/data:/run/udev/data:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - ${FSP_MON_TEXTFILE:?}:/textfile:ro
      - ${FSP_MON_HOME}/data/alloy:/var/lib/alloy/data
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    depends_on: [loki, prometheus]

  grafana:
    <<: *caps
    image: grafana/grafana:13.3.1
    container_name: fsp-monitor-grafana
    user: "${FSP_UID}:${FSP_GID}"
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?}/
      GF_SERVER_DOMAIN: ${GRAFANA_HOST}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # no plugin downloads from grafana.com at start-up; only Prometheus + Loki are needed
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: cloudwatch,grafana-postgresql-datasource,grafana-pyroscope-datasource,jaeger,mssql,mysql,opentsdb,zipkin,elasticsearch,stackdriver,influxdb,grafana-azure-monitor-datasource,graphite,tempo,parca,grafana-testdata-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fsp-releases.json
      FSP_GITHUB_REPO: ${GITHUB_REPO:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ${FSP_MON_HOME}/data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?}:3000"
    cpus: 0.5
    mem_limit: 512m        # measured 370 MiB working set after start — 384m left no headroom
    memswap_limit: 512m
    depends_on: [loki, prometheus]

networks:
  mon:
    name: fsp-monitor-network
    ipam:
      config:
        - subnet: ${FSP_MON_SUBNET:?}
