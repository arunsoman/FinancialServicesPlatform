# Prometheus — receives container + host metrics from Alloy (remote write) and scrapes the
# monitoring components. Retention is bounded by time AND size (compose flags).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
