
spring:
  application:
    name: fsp-core
  datasource:
    url: jdbc:postgresql://localhost:5432/fsp
    username: fsp
    password: fsp
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed/system
    # Consolidated-away migrations stay in the install history (dev DBs) — missing files are intentional.
    # *:future keeps Flyway's default: an OLDER core boots on a NEWER schema, which is what a
    # tag rollback does (rollback.yml; migrations are expand/contract). Without it, rollback crashes.
    ignore-migration-patterns: "*:missing,*:future"
    placeholders:
      fspBootstrapPassword: ${FSP_BOOTSTRAP_PASSWORD:fsp-admin}

server:
  port: 8081

fsp:
  security:
    internal-credential: ${FSP_INTERNAL_CREDENTIAL:}
    # Outbound hop core→EMI carries EMI's secret (per-target credentials, red-team P0 fix)
    emi-internal-credential: ${FSP_INTERNAL_CREDENTIAL_EMI:}
    default-person-password: ${FSP_PERSON_PASSWORD:fsp-person-2026}
  tigerbeetle:
    cluster-id: 0
    addresses: "127.0.0.1:3000"
  idp:
    # Core → IdP internal hop for admin-initiated password reset (credential-gated).
    base-url: ${FSP_IDP_URL:http://localhost:8082}
    internal-credential: ${FSP_INTERNAL_CREDENTIAL_IDP:}

  act-as:
    # plans/act-as-tenant-plan.md: "sudo into a tenant" — person-anchored, permission-gated
    # (tenant.act_as), strictly-below only, audited (ACT_AS_START/END). Safe as a shipped
    # default; switch off per environment if the operator wants it out.
    enabled: true
  orders:
    # Stage 4 SKU money (plan §7.1): core → EMI internal hop (money hands). Same env var
    # the gateway uses for its EMI catalog — one knob per environment.
    emi-base-url: ${FSP_EMI_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fsp: INFO
  # Default: machine-parsable — exactly ONE line per event, key=value, MDC correlation,
  # exceptions flattened to ' | ' (AGENTS.md §2c). For detailed multi-line logs run the
  # `debug` profile: --spring.profiles.active=debug (application-debug.yml).
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%-5p traceId=%X{traceId} tenantId=%X{tenantId} userId=%X{userId} logger=%logger{36} msg=%replace(%m){'\n',' '} ex=%replace(%ex){'\n',' | '}%n"
