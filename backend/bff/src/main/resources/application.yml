
spring:
  application:
    name: fsp-bff
  # Sessions in Postgres (spring-boot-starter-session-jdbc) so they survive a BFF restart / deploy.
  # Server-side only (FAPI 2.0: tokens + DPoP key never reach the browser); the table is created
  # by Spring Session on first start.
  session:
    jdbc:
      initialize-schema: always
      cleanup-cron: "0 */5 * * * *"
  datasource:
    url: jdbc:postgresql://localhost:5432/fsp
    username: fsp
    password: fsp
    driver-class-name: org.postgresql.Driver

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: FSPSESSION
        http-only: true
        secure: false # set true in production with HTTPS
        same-site: lax
        path: /
        max-age: 8h

fsp:
  gateway:
    base-url: ${FSP_GATEWAY_URL:http://localhost:8090}
  proxy:
    max-body-bytes: ${FSP_PROXY_MAX_BODY:65536}
  session:
    idle-timeout-minutes: 30
    absolute-timeout-minutes: 480

logging:
  level:
    com.fsp: DEBUG
